version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      prod-versions:
        applies-to: version-updates
        dependency-type: production
      dev-versions:
        applies-to: version-updates
        dependency-type: development
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: ".github"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      all:
        patterns:
          - "*"
